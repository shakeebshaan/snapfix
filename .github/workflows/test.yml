name: test

# snapfix has ZERO runtime dependencies and no package-lock.json,
# so there is deliberately no `npm ci` / `npm install` step — there is
# nothing to install, and an install step would fail. We just run the
# built-in node:test suite straight off a clean checkout.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:coverage
        continue-on-error: true
